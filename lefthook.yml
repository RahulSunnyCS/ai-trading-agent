pre-commit:
  parallel: false
  commands:
    biome-check:
      glob: "*.{ts,tsx}"
      run: "[ -f ./tools/biome ] && ./tools/biome check --no-errors-on-unmatched {staged_files} || true"

    typecheck:
      run: bun run typecheck

    lint:
      run: "[ -f ./tools/biome ] && ./tools/biome check . || bun run lint"

    env-guard:
      # Refuse to commit any .env file (except .env.example) to prevent
      # accidental credential exposure. Runs against all staged files.
      run: |
        staged=$(git diff --cached --name-only)
        for f in $staged; do
          if echo "$f" | grep -qE '^\.env$|^\.env\.'; then
            if [ "$f" != ".env.example" ]; then
              echo "ERROR: Refusing to commit $f — add secrets files to .gitignore, never commit them."
              exit 1
            fi
          fi
        done

    env-example-scan:
      glob: ".env.example"
      # Scan .env.example VALUES (right side of '=') for strings that look
      # like real credentials: ≥25 chars, alphanumeric+dash+underscore, AND
      # containing at least one letter AND one digit.
      # Only the value portion (after '=') is scanned so that long variable
      # names like RAZORPAY_CREDITS_PACK_50_PRICE_PAISE do not false-positive.
      # Comment lines (#) and blank lines are skipped by the grep -v.
      run: |
        if git diff --cached --name-only | grep -q '\.env\.example'; then
          if grep -v '^#' .env.example \
              | grep '=' \
              | sed 's/^[^=]*=//' \
              | grep -oE '[A-Za-z0-9_-]{25,}' \
              | grep -E '[A-Za-z]' \
              | grep -qE '[0-9]'; then
            echo "WARNING: .env.example may contain a real credential (alphanumeric string ≥25 chars found in a value field)."
            echo "Replace any real tokens with placeholder text before committing."
            exit 1
          fi
        fi

# NOTE: Date.now() / new Date() ban — enforcement via code review
# Biome 1.9's noRestrictedGlobals rule targets identifier references only;
# it cannot intercept method calls like Date.now() or constructor calls like
# new Date(). There is no native Biome rule that blocks these at the call site.
# Convention: all timestamp reads MUST go through the Clock interface in
# apps/server/src/utils/clock.ts so that tests can inject a deterministic
# FakeClock. Any PR introducing Date.now() or new Date() outside that file
# must be rejected at code review.

pre-push:
  # BL-014: the CI checks that take seconds, run only for the packages this branch changes
  # (`git diff origin/main...HEAD`). pytest stays in CI — the full Python suites take minutes,
  # and the real-data tests there depend on what is in ~/TradingData.
  parallel: true
  commands:
    biome:
      # The files this branch changes, not `.` — the working tree can hold untracked files
      # (Playwright's test-results/) that CI never sees.
      run: |
        files=$(git diff --name-only --diff-filter=d origin/main...HEAD | grep -E '\.(ts|tsx|js|jsx|json|jsonc|css)$')
        [ -z "$files" ] && exit 0
        biome=./tools/biome; [ -x "$biome" ] || biome=node_modules/.bin/biome
        echo "$files" | tr '\n' '\0' | xargs -0 "$biome" check --no-errors-on-unmatched

    ruff:
      run: |
        changed=$(git diff --name-only origin/main...HEAD)
        if echo "$changed" | grep -q '^packages/option-backtesting/'; then
          (cd packages/option-backtesting && uv run ruff check .) || exit 1
        fi
        if echo "$changed" | grep -q '^packages/momentum-backtesting/'; then
          (cd packages/momentum-backtesting && uv run ruff check . && uv run ruff format --check .) || exit 1
        fi

    server-unit:
      run: |
        if git diff --name-only origin/main...HEAD | grep -qE '^(apps/server|packages/(market-reference|broker-identity|notify))/|^(bun\.lock|tsconfig\.base\.json)$'; then
          bun run test:unit
        fi

    shared-packages:
      run: |
        for pkg in market-reference broker-identity notify; do
          if git diff --name-only origin/main...HEAD | grep -q "^packages/$pkg/"; then
            (cd "packages/$pkg" && bun run test) || exit 1
          fi
        done

    dashboard-unit:
      run: |
        if git diff --name-only origin/main...HEAD | grep -q '^apps/dashboard/'; then
          bun run --filter @ata/dashboard test
        fi

    momentum-goldens:
      # BL-001: a change that moves any frozen momentum backtest result may not be pushed
      # without accepting it (packages/momentum-backtesting/scripts/update-goldens.py).
      # Only runs when the push touches the momentum engine or the shared data package.
      run: |
        if git diff --name-only origin/main...HEAD | grep -qE '^packages/(momentum-backtesting|trading-data)/'; then
          cd packages/momentum-backtesting && uv run pytest tests/golden/test_golden.py tests/golden/test_coverage.py -q
        fi
