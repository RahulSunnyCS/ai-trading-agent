# CI for the Node workspaces that ci.yml path-ignores: packages/broker-login
# and packages/notify. Without this they would land with no checks at all.
#
# broker-login depends on notify, so a change to either must typecheck both —
# which is why they share one workflow rather than getting one each.
#
# Kept deliberately thin: neither package has a test suite, and broker-login's
# real verification is a manual workflow_dispatch run of "Daily broker login"
# against the live site.
name: Node Packages CI

on:
  push:
    branches: ['**']
    paths: ['packages/broker-login/**', 'packages/notify/**', '.github/workflows/broker-login-ci.yml']
  pull_request:
    branches: ['**']
    paths: ['packages/broker-login/**', 'packages/notify/**', '.github/workflows/broker-login-ci.yml']
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      # No browsers needed to typecheck; skips a ~100MB download per run.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      - run: bun install --frozen-lockfile

      - name: Verify lockfile not modified
        run: git diff --exit-code bun.lock

      - name: Typecheck notify
        run: bun run typecheck
        working-directory: packages/notify

      - name: Typecheck broker-login
        run: bun run typecheck
        working-directory: packages/broker-login
