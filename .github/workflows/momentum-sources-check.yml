name: Momentum sources check

# Reachability check for the momentum data sources from a GitHub-hosted runner's IP
# range: some sites (niftyindices.com, Yahoo) block datacenter IPs. Needs no secrets.
# The weekly signal itself now runs from the owner's own laptop (launchd, TODO.md
# 3.11.5 — the old GitHub Actions "Momentum weekly signal" workflow this check used to
# gate is retired), so this diagnostic no longer affects that job; kept as a standalone
# manual check in case CI-based execution is ever reconsidered.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/momentum-backtesting
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: '0.8.x'

      - run: uv sync --frozen

      - run: uv run mbt sources-check
