# CI for the packages/contract-notes workspace.
#
# ci.yml path-ignores packages/**, so without this the Jest suite covering the
# broker PDF extractors would never run. The extractor tests work off the invented
# text fixtures in tests/fixtures/; qpdf is installed so the decryption tests in
# tests/fetchMail.test.js (which build their own blank PDF) run instead of skipping.
name: Contract Notes CI

on:
  push:
    branches: ['**']
    paths: ['packages/contract-notes/**', '.github/workflows/contract-notes-ci.yml']
  pull_request:
    branches: ['**']
    paths: ['packages/contract-notes/**', '.github/workflows/contract-notes-ci.yml']
  workflow_dispatch:

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The package is CommonJS and its scripts shell out to `node`.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # fetchMail.js decrypts the notes with the qpdf binary.
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      - run: bun install --frozen-lockfile

      - name: Verify lockfile not modified
        run: git diff --exit-code bun.lock

      - run: bun run test
        working-directory: packages/contract-notes
