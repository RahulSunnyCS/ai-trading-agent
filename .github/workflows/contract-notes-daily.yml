name: Daily Trading Data Processing

on:
  # SCHEDULE DISABLED for the monorepo migration. The trade-analytics repo still
  # owns this cron; enabling it here too would have both copies writing the same
  # Google Sheet on the same night, duplicating rows and corrupting row_tracker.
  #
  # To hand over: (1) disable the cron in trade-analytics, (2) run this workflow
  # once via workflow_dispatch and check the row it picks against the sheet --
  # the `row-tracker` artifact does NOT migrate, so the first run here falls back
  # to reading the sheet, (3) then uncomment the block below.
  # schedule:
  #   - cron: "1 0 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download row-tracker from previous successful workflow run (if exists)
        run: |
          echo "Trying to find latest row-tracker artifact..."

          ARTIFACT_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts")

          ARTIFACT_ID=$(echo "$ARTIFACT_INFO" | jq -r '.artifacts[] | select(.name=="row-tracker") | .id' | head -n 1)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No previous artifact found, proceeding without it."
          else
            echo "Found artifact ID: $ARTIFACT_ID"
            curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -o artifact.zip \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip"
            
            unzip artifact.zip -d packages/contract-notes
          fi
        shell: bash

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      # Bun installs the workspace from the root lockfile. The package's own
      # scripts still invoke `node`, so setup-node above remains the runtime.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test
        working-directory: packages/contract-notes

      - name: Check sheet dates
        run: bun run check-dates
        working-directory: packages/contract-notes
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}

      - name: Process gap dates
        run: |
          if [ ! -f gap_dates.txt ]; then
            echo "No gap dates found. Exiting."
            exit 0
          fi
          updated=false
          skipped=""
          while IFS= read -r date; do
            [ -z "$date" ] && continue
            echo "::group::Processing gap date $date"
            rm -rf ./data

            # A date that cannot be fetched, decrypted or parsed is left as a
            # gap and reported at the end. It must not abort the run: the
            # remaining dates, and the row-tracker progress made so far, are
            # worth far more than failing fast on one bad contract note.
            if ! TARGET_DATE="$date" bun run fetch; then
              echo "::warning title=Fetch failed::$date could not be fetched or decrypted — left as a gap"
              skipped="$skipped $date"
              rm -rf ./data
              echo "::endgroup::"
              continue
            fi

            count=$(find ./data -type f -name '*_decrypted.pdf' 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "📭 No decrypted PDF files found for $date. Skipping."
              rm -rf ./data
              echo "::endgroup::"
              continue
            fi
            echo "✅ Decrypted PDF files found: $count"

            if ! TARGET_DATE="$date" bun run parse; then
              echo "::warning title=Parse failed::$date could not be parsed — left as a gap"
              skipped="$skipped $date"
              rm -rf ./data
              echo "::endgroup::"
              continue
            fi

            TARGET_DATE="$date" bun run sheet
            updated=true
            # Recorded per date, so the artifact is still uploaded if a later
            # date aborts the run.
            echo "updated=true" >> $GITHUB_ENV
            rm -rf ./data
            echo "::endgroup::"
          done < gap_dates.txt

          echo "updated=$updated" >> $GITHUB_ENV

          if [ -n "$skipped" ]; then
            echo "### Dates left as gaps" >> $GITHUB_STEP_SUMMARY
            for d in $skipped; do echo "- $d" >> $GITHUB_STEP_SUMMARY; done
            echo "::error title=Dates left unprocessed::$skipped"
            exit 1
          fi
        working-directory: packages/contract-notes
        env:
          BROKER_ACCOUNTS_JSON: ${{ secrets.BROKER_ACCOUNTS_JSON }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHEET_GID: ${{ secrets.SHEET_GID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}

      # always(): rows already written to the sheet must not be re-written on
      # the next run just because a later date failed.
      - name: Upload updated row_tracker.json as artifact
        if: always() && env.updated == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: row-tracker
          path: packages/contract-notes/row_tracker.json

      - name: Delete old artifacts
        if: success() && env.updated == 'true'
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: "2 day"
          skip-recent: 5
