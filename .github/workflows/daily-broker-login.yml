name: Daily broker login

on:
  # PRIMARY TRIGGER IS NOT HERE: since 2026-10-05 the owner's laptop dispatches this
  # workflow at 08:00 IST trading days (apps/scheduler, packages/broker-login/src/dispatch.ts),
  # because GitHub delivered these crons ~6 hours late. They stay as a late backstop
  # for days the laptop is off, and skip entirely once a run succeeded that day, or
  # a run's AlgoTest step did (backstop-check below); brokers already logged in are
  # reported SKIPPED. A backstop never logs in to Quantiply once any run happened that
  # day, whatever its result (a wrong Angel One PIN must not be sent again and again).
  # So if the 08:00 run fails before its login steps (bun install, say), the backstops still
  # log in to AlgoTest but Quantiply waits for a manual dispatch with quantiply=on that day.
  #
  # 02:45 UTC = 08:15 IST, weekdays only. AlgoTest opens broker logins at 08:15 IST;
  # if the scheduler fires a minute early, main.ts's window guard waits it out. The
  # second entry is a 08:45 IST backstop for a dropped or failed first run: brokers
  # already logged in are reported SKIPPED, and Quantiply is off for it whenever an
  # earlier run today exists, so it repeats no login that already ran.
  # Market holidays are not filtered here: AlgoTest refuses the login and the run
  # fails with a Telegram alert, which is expected on those days.
  schedule:
    - cron: '45 2 * * 1-5'
    - cron: '15 3 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Single broker to run (angelone or finvasia). Blank uses the BROKER_LOGIN_ONLY repository variable; both blank runs both.'
        required: false
        default: ''
      quantiply:
        description: 'Quantiply login via Angel One. "default" uses the QUANTIPLY_LOGIN repository variable (unset = off).'
        type: choice
        options: ['default', 'on', 'off']
        required: false
        default: 'default'
      trace:
        description: 'Capture a Playwright trace of the AlgoTest logins (contains sensitive DOM snapshots; Quantiply is never traced)'
        type: boolean
        required: false
        default: false
      skip_window_guard:
        description: 'Skip waiting for the 08:15 IST window (off-hours testing)'
        type: boolean
        required: false
        default: false

concurrency:
  group: broker-login
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # GitHub delivers the backstop crons hours late (15:55 IST on 5 and 6 Oct), after
  # AlgoTest's login window, so they failed and sent a false "login failed" alert even
  # though the 08:00 laptop dispatch had already logged both brokers in. A scheduled run
  # now stops here when a run of this workflow already succeeded today, or one whose
  # "Log in brokers" step succeeded (the AlgoTest logins worked; only Quantiply's own
  # step failed). Dates are UTC, which is the IST date for every run between 05:30 and
  # 23:59 IST.
  #
  # quantiply_off: a scheduled run never logs in to Quantiply when any run of this
  # workflow was created today, whatever its result. Quantiply's failure fails the run,
  # so without this every backstop would send Angel One another login - with a wrong
  # PIN, refused attempts that GitHub repeats until Angel locks the account (the
  # laptop's angel-login-check hold can't see these).
  backstop-check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      quantiply_off: ${{ steps.check.outputs.quantiply_off }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          skip=false
          quantiply_off=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            today=$(date -u +%Y-%m-%d)
            runs=$(gh api "repos/${REPO}/actions/workflows/daily-broker-login.yml/runs?created=>=${today}&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != ${RUN_ID}) | {id, conclusion}]")
            if [ "$(jq 'length' <<<"${runs}")" -gt 0 ]; then
              quantiply_off=true
              echo "A run already happened today; this backstop does not log in to Quantiply."
            fi
            ok=$(jq '[.[] | select(.conclusion == "success")] | length' <<<"${runs}")
            if [ "${ok:-0}" -gt 0 ]; then
              skip=true
              echo "Already logged in today (${ok} successful run(s)); backstop not needed."
            else
              for id in $(jq -r '.[] | select(.conclusion != null) | .id' <<<"${runs}"); do
                done_algotest=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" \
                  --jq '[.jobs[].steps[]? | select(.name == "Log in brokers" and .conclusion == "success")] | length')
                if [ "${done_algotest:-0}" -gt 0 ]; then
                  skip=true
                  echo "Run ${id} already logged the AlgoTest brokers in (only Quantiply failed); backstop not needed."
                  break
                fi
              done
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "quantiply_off=${quantiply_off}" >> "$GITHUB_OUTPUT"

  login:
    needs: backstop-check
    if: needs.backstop-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Browsers are preinstalled here, so there is no download step and no cache to
    # invalidate. The tag must stay in lockstep with the playwright version in
    # package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Generous, because the window guard can sleep if the scheduler fires early.
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      # Container-only prep (container jobs run as root, so no sudo):
      # - the Playwright image ships without unzip, which setup-bun needs to
      #   unpack the Bun release zip;
      # - the workspace is owned by the runner user, not root, so git refuses
      #   to operate on it ("dubious ownership") and the root `prepare` script's
      #   `lefthook install` fails during bun install. checkout's own
      #   safe.directory entry is scoped to that step only.
      - name: Prepare container
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      # Installs the whole workspace from the root bun.lock. The Playwright
      # container already carries the browsers, so the postinstall download is
      # skipped via PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD above.
      - run: bun install --frozen-lockfile

      - name: Log in brokers
        id: login
        env:
          ALGOTEST_PHONE: ${{ secrets.ALGOTEST_PHONE }}
          ALGOTEST_PASSWORD: ${{ secrets.ALGOTEST_PASSWORD }}
          ANGELONE_CLIENT_CODE: ${{ secrets.ANGELONE_CLIENT_CODE }}
          ANGELONE_MPIN: ${{ secrets.ANGELONE_MPIN }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
          SHOONYA_CLIENT_ID: ${{ secrets.SHOONYA_CLIENT_ID }}
          SHOONYA_PASSWORD: ${{ secrets.SHOONYA_PASSWORD }}
          SHOONYA_TOTP_SECRET: ${{ secrets.SHOONYA_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # A dispatch's own input wins; otherwise the repository variable BROKER_LOGIN_ONLY (set in
          # Settings > Secrets and variables > Actions > Variables) decides for the 08:00 dispatch and
          # the cron backstop alike. Unset or empty = both brokers. A value other than angelone or
          # finvasia fails the run loudly (config.ts), with the usual Telegram alert.
          ONLY: ${{ inputs.only || vars.BROKER_LOGIN_ONLY }}
          # Also log in to Quantiply (Angel One's algo platform) with the ANGELONE_* secrets above:
          # before AlgoTest's 08:15 window when there is time, else after the AlgoTest logins. Off
          # unless the repository variable QUANTIPLY_LOGIN (or a dispatch's quantiply input) says on:
          # `gh variable set QUANTIPLY_LOGIN --body on`. Independent of ONLY. A cron backstop forces
          # it off once any run happened today (backstop-check). Any value other than on/off is
          # reported as a Quantiply failure; the AlgoTest logins still run.
          QUANTIPLY_LOGIN: ${{ needs.backstop-check.outputs.quantiply_off == 'true' && 'off' || ((inputs.quantiply && inputs.quantiply != 'default') && inputs.quantiply || vars.QUANTIPLY_LOGIN) }}
          TRACE: ${{ inputs.trace && '1' || '' }}
          SKIP_WINDOW_GUARD: ${{ inputs.skip_window_guard && '1' || '' }}
        run: bun run login
        working-directory: packages/broker-login

      # Quantiply's result as its own step (main.ts writes it to the step output): its failure
      # fails the job, so the morning summary flags it, while "Log in brokers" stays green when
      # the AlgoTest logins worked - which backstop-check and the summary read to tell them apart.
      - name: Quantiply login
        if: always() && steps.login.outputs.quantiply == 'FAIL'
        run: |
          echo "::error::Quantiply login failed - the Telegram report and the Log in brokers step say why"
          exit 1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: packages/broker-login/artifacts/
          retention-days: 3
          if-no-files-found: ignore

      # GitHub disables scheduled workflows after 60 days without *repository*
      # activity - workflow runs alone do not count. This daily commit resets that
      # clock and doubles as an audit trail.
      - name: Update run log
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          line="$(printf '%s  %s  run %s' \
            "$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')" \
            "${{ job.status }}" \
            "${{ github.run_id }}")"
          # Rebuild the commit on the branch tip each attempt rather than rebasing:
          # the log is append-only, so a re-run (which checks out the run's original
          # SHA) or a concurrent push always conflicts on the last line. The workspace
          # is disposable by now and diagnostics have already been uploaded.
          # --no-verify skips the repo's lefthook pre-commit (a full typecheck).
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME" &&
              git reset --quiet --hard FETCH_HEAD &&
              printf '%s\n' "$line" >> packages/broker-login/run-log.md &&
              git add packages/broker-login/run-log.md &&
              git commit --quiet --no-verify -m "chore: broker login run log" &&
              git push --quiet origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::warning::could not push run log"
