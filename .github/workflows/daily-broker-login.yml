name: Daily broker login

on:
  # 02:30 UTC = 08:00 IST, weekdays only. AlgoTest opens broker logins at 08:15 IST;
  # firing 15 minutes early gives main.ts's window guard room to wait out both that
  # gap and GitHub's own scheduling jitter. The second entry is a 08:30 IST backstop
  # for a dropped or failed first run: a broker that is already logged in is reported
  # SKIPPED, so it is a no-op otherwise.
  # Market holidays are not filtered here: AlgoTest refuses the login and the run
  # fails with a Telegram alert, which is expected on those days.
  schedule:
    - cron: '30 2 * * 1-5'
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Single broker to run (angelone or finvasia). Blank runs both.'
        required: false
        default: ''
      trace:
        description: 'Capture a Playwright trace (contains sensitive DOM snapshots)'
        type: boolean
        required: false
        default: false
      skip_window_guard:
        description: 'Skip waiting for the 08:15 IST window (off-hours testing)'
        type: boolean
        required: false
        default: false

concurrency:
  group: broker-login
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest
    # Browsers are preinstalled here, so there is no download step and no cache to
    # invalidate. The tag must stay in lockstep with the playwright version in
    # package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Generous, because the window guard can sleep if the scheduler fires early.
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      # Container-only prep (container jobs run as root, so no sudo):
      # - the Playwright image ships without unzip, which setup-bun needs to
      #   unpack the Bun release zip;
      # - the workspace is owned by the runner user, not root, so git refuses
      #   to operate on it ("dubious ownership") and the root `prepare` script's
      #   `lefthook install` fails during bun install. checkout's own
      #   safe.directory entry is scoped to that step only.
      - name: Prepare container
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      # Installs the whole workspace from the root bun.lock. The Playwright
      # container already carries the browsers, so the postinstall download is
      # skipped via PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD above.
      - run: bun install --frozen-lockfile

      - name: Log in brokers
        env:
          ALGOTEST_PHONE: ${{ secrets.ALGOTEST_PHONE }}
          ALGOTEST_PASSWORD: ${{ secrets.ALGOTEST_PASSWORD }}
          ANGELONE_CLIENT_CODE: ${{ secrets.ANGELONE_CLIENT_CODE }}
          ANGELONE_MPIN: ${{ secrets.ANGELONE_MPIN }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
          SHOONYA_CLIENT_ID: ${{ secrets.SHOONYA_CLIENT_ID }}
          SHOONYA_PASSWORD: ${{ secrets.SHOONYA_PASSWORD }}
          SHOONYA_TOTP_SECRET: ${{ secrets.SHOONYA_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONLY: ${{ inputs.only }}
          TRACE: ${{ inputs.trace && '1' || '' }}
          SKIP_WINDOW_GUARD: ${{ inputs.skip_window_guard && '1' || '' }}
        run: bun run login
        working-directory: packages/broker-login

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: packages/broker-login/artifacts/
          retention-days: 3
          if-no-files-found: ignore

      # GitHub disables scheduled workflows after 60 days without *repository*
      # activity - workflow runs alone do not count. This daily commit resets that
      # clock and doubles as an audit trail.
      - name: Update run log
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          line="$(printf '%s  %s  run %s' \
            "$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')" \
            "${{ job.status }}" \
            "${{ github.run_id }}")"
          # Rebuild the commit on the branch tip each attempt rather than rebasing:
          # the log is append-only, so a re-run (which checks out the run's original
          # SHA) or a concurrent push always conflicts on the last line. The workspace
          # is disposable by now and diagnostics have already been uploaded.
          # --no-verify skips the repo's lefthook pre-commit (a full typecheck).
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME" &&
              git reset --quiet --hard FETCH_HEAD &&
              printf '%s\n' "$line" >> packages/broker-login/run-log.md &&
              git add packages/broker-login/run-log.md &&
              git commit --quiet --no-verify -m "chore: broker login run log" &&
              git push --quiet origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::warning::could not push run log"
