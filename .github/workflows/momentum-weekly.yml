name: Momentum weekly signal

# Friday signal for packages/momentum-backtesting, sent to Telegram.
#   preview  14:40 IST - live prices, so the trades can go in before the 15:30 close
#   final    16:45 IST - official closes; says what (if anything) the close changed
#
# SCHEDULE DISABLED until a manual workflow_dispatch run of each kind has passed (and
# "Momentum sources check" has shown the data sites answer GitHub's runners). To enable,
# uncomment the block below. Minutes are off the hour because GitHub delays :00 runs
# the most; the preview still checks the clock and says if it's too late to trade.
#   09:10 UTC = 14:40 IST, 11:15 UTC = 16:45 IST, Fridays only.
on:
  # schedule:
  #   - cron: '10 9 * * 5'
  #   - cron: '15 11 * * 5'
  workflow_dispatch:
    inputs:
      run:
        description: 'preview (live prices) or final (official closes)'
        type: choice
        options: [preview, final]
        default: final
      fyers:
        description: 'Log in to Fyers for official/live prices (else public sources only)'
        type: boolean
        default: true

concurrency:
  group: momentum-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    # Secrets live in this Environment, not at repository level: restrict it to the
    # default branch in Settings -> Environments so no other branch can read them.
    environment: fyers-data
    # Browsers are preinstalled; the tag must match playwright in
    # packages/broker-login/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      RUN_KIND: ${{ github.event_name == 'schedule' && (github.event.schedule == '10 9 * * 5' && 'preview' || 'final') || inputs.run }}

    steps:
      - uses: actions/checkout@v4

      # Outside the checkout, so nothing fetched can be committed by accident. (The
      # runner context isn't available in job-level env, hence a step.)
      - name: Paths
        run: |
          echo "MOMENTUM_DATA_DIR=$RUNNER_TEMP/momentum-data" >> "$GITHUB_ENV"
          echo "FYERS_TOKEN_FILE=$RUNNER_TEMP/fyers-token.json" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.x'

      - run: bun install --frozen-lockfile

      # Mints today's data token headlessly (client ID -> TOTP -> PIN). Never printed:
      # it is masked and written 0600 to FYERS_TOKEN_FILE, which the last step deletes.
      # A failure here is alerted on Telegram and the signal falls back to public data.
      - name: Fyers login
        id: fyers
        if: github.event_name == 'schedule' || inputs.fyers
        continue-on-error: true
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_APP_SECRET: ${{ secrets.FYERS_APP_SECRET }}
          FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET: ${{ secrets.FYERS_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bun run fyers-token
        working-directory: packages/broker-login

      - uses: astral-sh/setup-uv@v3
        with:
          version: '0.8.x'

      - name: Weekly signal
        env:
          MOMENTUM_DATABASE_URL: ${{ secrets.MOMENTUM_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv sync --frozen
          uv run mbt weekly --run "$RUN_KIND"
        working-directory: packages/momentum-backtesting

      - name: Delete the Fyers token
        if: always()
        run: rm -f "$FYERS_TOKEN_FILE"

      - name: Upload login diagnostics
        if: always() && (failure() || steps.fyers.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: fyers-login-diagnostics-${{ github.run_id }}
          # Screenshots have every input blanked and the HTML is redacted - see
          # packages/broker-login/src/diagnose.ts.
          path: packages/broker-login/artifacts/
          retention-days: 3
          if-no-files-found: ignore
