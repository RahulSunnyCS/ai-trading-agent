# Round 1 (wide screening), arm B: Total Market pool, category layer OFF (direct pool rank).
#   uv run mbt search run search_spaces/round1_B.toml --heavy 100 --light 80 --workers 4
# TOML has no null: the string "none" means None (e.g. no cap).
name = "round1_B"
arm = "B"

[fixed]
start = "2017-01-01"
cost_model = "itemised"
slippage_bps = 5.0
respect_circuits = true        # UC blocks buys, LC blocks sells
min_ranked = 1
liq_floor_ratio = 0.25
liq_circuit = true

# Each distinct combination costs one full ranking build (~9 s on this universe).
[heavy]
lookbacks = { choice = [[1, 4, 13, 26, 52], [4, 13, 26, 52], [13, 26, 52], [4, 13, 26], [13, 26]] }
weight_scheme = { choice = ["equal", "recent", "long"] }
score = { choice = ["ranksum", "voladj", "blend"] }
voladj_skip_recent_month = { choice = [true, false] }
liq_min_turnover_cr = { choice = [1.0, 2.0, 5.0] }
liq_min_price = { choice = [20.0, 50.0] }
liq_circuit_run = { choice = [3, 5] }
liq_max_circuit_days = { choice = ["none", 5] }

# Cheap: ~1 s each on a cached ranking. No category settings: there is no category layer in OFF mode.
[light]
pool_top_n = { int = [30, 400] }
pool_band = { int = [0, 300] }
off_top_n = { int = [5, 40] }
off_band = { int = [0, 40] }
max_position = { choice = [0.05, 0.1, 0.15, 0.2, 0.25, 0.35, "none"] }
cap_band = { float = [0.02, 0.1] }
entry = { choice = ["wait", "make_room"] }
rebalance_every = { choice = [1, 2, 4] }
rebalance_offset_raw = { int = [0, 3] }
sell_every_week = { choice = [true, false] }
signal_delay = { choice = [0, 1] }
max_stock_price = { choice = ["none", 5000, 20000] }
momentum_sizing = { choice = [false, true] }
