# Live-money rules for Momentum (BL-025). Written before the first rupee and set by the owner
# (2026-10-07); Claude does not choose these numbers. A later change is a new commit with the
# reason in the BL-025 Log, never a quiet edit. Nothing in this repo trades: a breached rule
# sends a Telegram alert that names the rule and the action written here, and the owner acts.

[stage]
# "paper" until the money gate below passes and the owner says go; then "live".
current = "paper"
# The Friday paper tracking counts from: the forward journal's first clean Friday (BL-024 decision 5).
paper_start = "2026-10-09"

[strategy]
# What is tracked now, and what the money would follow if the gate passes.
followed = "BL-010 Phase 6 frozen ensemble (search_spaces/bl010_phase6_frozen.json)"
compared_with = ["the basket's median config (BL-010 tracker)", "Nifty200 Momentum 30 TRI"]
source = "the forward-signal journal (BL-024): signals as recorded each Friday, never rebuilt"

[money_gate]
# Money goes in only when ALL of these hold, and only after the owner confirms in the BL-025 Log.
min_paper_weeks = 13
# Over the paper weeks, the ensemble's journal return must beat this benchmark's.
must_beat = "Nifty200 Momentum 30 TRI"
# Neither drawdown rule below may have triggered during the paper weeks.
no_drawdown_rule_hit = true
confirm_action = "Money has not moved: the system never trades. If you agree, log the go decision in BL-025 and set stage.current to live."

[capital]
amount_rs = 500000
share_of_portfolio = "10-20%"

[drawdown]
# Measured from the highest value the followed money has reached (paper equity while paper).
cut_half_at = 0.20
cut_half_action = "Sell half of every holding, then keep following the weekly signal at half size."
exit_at = 0.30
exit_action = "Sell everything and stop following the signal. Review before any re-entry."
re_entry = "only after a review logged in BL-025 says so"

[trailing]
# Live (paper or real) return minus the backtest's return for the SAME weeks.
window_weeks = 13
review_when_behind_pts = 5.0
review_action = "No new money. Review what changed (data, costs, fills) and log carry on, pause or stop in BL-025."

[alerts]
to = "owner only (friends see these rules for information; their money is their decision)"
cadence = "weekly, after the Friday final run"
