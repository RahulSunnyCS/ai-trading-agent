# Live-money rules for Momentum (BL-025). Written before the first rupee and set by the owner
# (2026-10-07); Claude does not choose these numbers. A later change is a new commit with the
# reason in the BL-025 Log, never a quiet edit. Nothing in this repo trades: a breached rule
# sends a Telegram alert that names the rule and the action written here, and the owner acts.

[stage]
# "paper" until the money gate below passes and the owner says go; then "live".
current = "paper"
# The Friday the followed money counts from: Friday 1 of 4 of the Kite lots under the Four-Strategy
# Mix (BL-176), whose first lot traded on 2026-10-23 (lots 2-4 on 30 Oct, 6 Nov and 13 Nov). Until
# 2026-11-20 this was 2026-10-16, the first Friday of the Four Sectors Monthly lots (BL-142: first
# buy Monday 2026-10-19); the weeks and the 13-week money gate count from the new date (BL-025 Log).
paper_start = "2026-10-23"

[strategy]
# What is tracked now, and what the money would follow if the gate passes.
followed = "Four-Strategy Mix, BSE Tags (BL-176 extended-tags ensemble: sleeves d5ad8da622e7, d7b06967be4e, 00d4034e807e 4-weekly and 02ff9a531230 2-weekly; the headline the Kite lots follow)"
config_file = "search_spaces/bl176_followed.json"
compared_with = ["Nifty200 Momentum 30 TRI"]
source = "the forward-signal journal (BL-024): signals as recorded each Friday, never rebuilt"

[money_gate]
# Money goes in only when ALL of these hold, and only after the owner confirms in the BL-025 Log.
min_paper_weeks = 13
# Over the paper weeks, the followed strategy's journal return must beat this benchmark's.
must_beat = "Nifty200 Momentum 30 TRI"
# Neither drawdown rule below may have triggered during the paper weeks.
no_drawdown_rule_hit = true
confirm_action = "Money has not moved: the system never trades. If you agree, log the go decision in BL-025 and set stage.current to live."

[capital]
amount_rs = 500000
share_of_portfolio = "10-20%"

[drawdown]
# Measured from the highest value the followed money has reached (paper equity while paper).
cut_half_at = 0.20
# What follows a line is the owner's call each time (BL-025 open question 3, 2026-10-28: N, alert
# and review). The registered rule test found no mechanical rule that passes.
cut_half_action = "Review now and decide: sell half of every holding and follow the signal at half size, or hold. Log the decision and why in BL-025."
exit_at = 0.30
exit_action = "Review now and decide: sell everything and stop following the signal, or hold. Log the decision and why in BL-025."
re_entry = "your call each time, logged in BL-025 with the reason"

[trailing]
# Live (paper or real) return minus the backtest's return for the SAME weeks.
window_weeks = 13
review_when_behind_pts = 5.0
review_action = "No new money. Review what changed (data, costs, fills) and log carry on, pause or stop in BL-025."

[alerts]
to = "owner only (friends see these rules for information; their money is their decision)"
cadence = "weekly, after the Friday final run"
