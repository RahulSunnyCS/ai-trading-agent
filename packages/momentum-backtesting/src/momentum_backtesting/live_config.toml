# The strategy the weekly Friday signal (`mbt weekly`) runs. Edit, commit, and the next run
# uses it. Any engine.Config field can go here; these are the defaults as first specified.
top_n = 5
exit_rank = 10
lookbacks = [1, 4, 13, 26, 52]
defensive = "off"
portfolio = "buffer"
entry = "wait"
max_position = 0.35
cost_pct = 0.10
start = "2017-01-01"

# What P&L (and so position sizes and cap trims) is measured on. "etf" since `mbt tracking`
# (2026-09-28) put the ETF gap at +0.72 CAGR points a year, past the 0.5 threshold.
track = "etf"

# Flag a buy whose ETF trades this far above NAV (needs amfi_code in universe.csv).
premium_warn_pct = 1.0
premium_warn_international_pct = 2.0

# BL-136: do not open a NEW position whose ETF trades this far above NAV (the latest NAV known
# at the run, normally Thursday's). The next-best name within the exit rank takes its slot, the
# row is recorded as "SKIP (premium)" in the journal and on This week, and a top-up of a name
# already held is only flagged (above), never blocked. These limits apply to every ETF
# favourite, not just this fallback strategy. 0 = off. The owner's starting numbers
# (2026-10-18): 2% domestic, 5% international (about a year of the strategy's backtested edge).
premium_block_pct = 2.0
premium_block_international_pct = 5.0
