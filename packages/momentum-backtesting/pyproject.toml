[project]
name = "momentum-backtesting"
version = "0.1.0"
description = "Weekly momentum rotation backtester across Indian sector/broad indices, gold, silver, international and debt ETFs."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "typer>=0.13",
    # Reads the day's Fyers token from the broker_tokens table (the dashboard's
    # "Login with Fyers" flow) when FYERS_ACCESS_TOKEN isn't set in .env.
    "psycopg[binary]>=3.2",
    # Private API (`mbt serve`), same versions as packages/option-backtesting.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Nifty 50 stock data layer (stocks/): daily.parquet / events.parquet I/O.
    # >=14.0.1 for CVE-2023-47248 (see stocks/ plan.md §5).
    "pyarrow>=14.0.1",
    "trading-data",
]

[tool.uv.sources]
# The shared local research database (TRADING_DATA_ROOT) — a sibling package, editable.
trading-data = { path = "../trading-data", editable = true }

[project.scripts]
mbt = "momentum_backtesting.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",  # FastAPI TestClient
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum_backtesting"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
