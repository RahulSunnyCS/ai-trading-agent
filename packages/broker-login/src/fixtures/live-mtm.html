<!doctype html>
<!--
  BL-143: a stand-in for AlgoTest /live's MTM cards, built from the markup its bundle renders
  (chunk 2331, 2026-10-20): one [data-testid="broker-mtm"] card per broker plus "Total MTM", the
  figure a p.tabular-nums with text-green-500 (>= 0) or text-red-500 (< 0). The header around them
  also shows margin figures, which must never be read as the MTM.
-->

  <body>
    <div>Broker Login 1/2</div>
    <div>1/6 Strategy Deployed</div>
    <div data-testid="broker-mtm">

      <div class="w-full px-3 pt-1"><p class="text-base font-bold tabular-nums text-red-500">₹ 6,512.25</p></div>
      <p class="mt-3 px-3 text-xxsm hidden">+ Add SL/Tgt</p>
    </div>
    <div data-testid="broker-mtm">
      <div><div class="flex items-center gap-1 text-primaryBlack-750">Finvasia - FA0000</div></div>
      <div class="w-full px-3 pt-1"><p class="text-base font-bold tabular-nums text-red-500">₹ 6,512.25</p></div>
    </div>
    <div>Available Margin</div>
    <div>₹ 12,50,074</div>
    <div>Margin Blocked (approx)</div>
    <div>₹ 2,10,000</div>
  </body>
</html>
