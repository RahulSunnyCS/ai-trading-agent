[project]
name = "trading-data"
version = "0.1.0"
description = "The local research database shared by option-backtesting and momentum-backtesting: a DuckDB catalog plus a Parquet lake under TRADING_DATA_ROOT."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "typer>=0.13",
]

[project.scripts]
tdata = "trading_data.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
