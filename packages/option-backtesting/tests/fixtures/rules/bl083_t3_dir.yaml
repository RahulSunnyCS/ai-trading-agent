# BL-083 T3 straddle turn and range stabilising, said in the BL-120 rule grammar. Acceptance fixture: the tester must find the same
# firings as research/bl083/triggers.py and the same event-minus-placebo as its event study.
rule:
  id: bl083_t3_dir
  name: BL-083 T3 to Dir
  underlying: NIFTY
  window: { from: "10:30", to: "14:00" }
  define:
    st: { straddle: { at: "09:20" } }
    r30: { div: [{ sub: [{ roll_max: { x: high, n: 30 } }, { roll_min: { x: low, n: 30 } }] }, atr14] }
  when:
    all:
      - ge: [{ max_since: { x: st, after: "10:00" } }, { mul: [1.05, { at: { x: st, clock: "10:00" } }] }]
      - le: [st, { mul: [0.97, { max_since: { x: st, after: "10:00" } }] }]
      - lt: [r30, { prior_median: { x: r30, sessions: 252 } }]
  template:
    exit_time: "15:28"
    square_off: partial
    legs:
      - id: ce
        lots: 1
        position: sell
        option_type: CE
        expiry: weekly
        strike: { strike_type: ATM }
        stop_loss: { percent: 21 }
        reentry_on_sl: { mode: cost, count: 1 }
      - id: pe
        lots: 1
        position: sell
        option_type: PE
        expiry: weekly
        strike: { strike_type: ATM }
        stop_loss: { percent: 21 }
        reentry_on_sl: { mode: cost, count: 1 }
    overall:
      stop_loss_inr: 3000
